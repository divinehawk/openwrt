# Builds a single device (netgear_rbr40) in ipq40xx/generic and checks that
# its kernel image doesn't exceed its fixed partition size - the failure
# mode we hit from target/linux/ipq40xx/generic/config-default growing by
# CONFIG_PWM=y. Use this after trimming LEDS_LP5521/LP5523/LP5562/
# TLC591XX/GPIO_74X164 etc. to =m to confirm the fix.
#
# netgear_rbr40 was the first and tightest of the six devices that went
# over budget (netgear_rbr40/rbs40/rbr50/rbs50/srr60/srs60 all overflowed
# by ~11.7-11.9KB, essentially identical margins), so it's a representative
# single check rather than needing to build all of them. The size check
# only happens at image-build time (target/install), which needs an
# explicit device selected - without one, defconfig won't produce any
# per-device image to check at all.

name: Verify ipq40xx/generic kernel image size (netgear_rbr40)

on:
  workflow_dispatch:
  push:
    branches:
      - ci/verify-kernel-size

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost
          if [ -n "${AGENT_TOOLSDIRECTORY:-}" ]; then
            sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          fi
          df -h /

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ \
            gawk gcc-multilib g++-multilib gettext git libncurses-dev \
            libssl-dev python3-setuptools rsync swig unzip zlib1g-dev \
            file wget

      - name: Configure - single device
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_ipq40xx=y
          CONFIG_TARGET_ipq40xx_generic=y
          CONFIG_TARGET_MULTI_PROFILE=y
          CONFIG_TARGET_ipq40xx_generic_DEVICE_netgear_rbr40=y
          EOF
          make defconfig

          if ! grep -q "^CONFIG_TARGET_ipq40xx_generic_DEVICE_netgear_rbr40=y" .config; then
            echo "::error::netgear_rbr40 device profile not selected - no image will be built to check"
            exit 1
          fi

      - name: Download sources
        run: make -j$(nproc) download

      - name: Build (toolchain, kernel, packages, images)
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          make -j$(nproc) 2>&1 | tee build.log

      - name: Assert no oversized kernel images
        run: |
          echo "build outcome=${{ steps.build.outcome }}"

          if grep -q "is too big" build.log; then
            echo "::error::netgear_rbr40 image still exceeds its kernel partition size"
            grep -B1 "is too big" build.log
            exit 1
          fi

          if [ "${{ steps.build.outcome }}" != "success" ]; then
            echo "::error::Build failed for a reason other than image size - check build.log"
            tail -60 build.log
            exit 1
          fi

          echo "netgear_rbr40 image fits within its kernel partition limit."

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
