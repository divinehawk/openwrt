name: Build UTR

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib gettext git libncurses-dev libssl-dev python3-setuptools \
            rsync unzip zlib1g-dev file wget

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add UTR board data
        run: |
          git clone https://github.com/divinehawk/firmware_qca-wireless /tmp/qca-wireless
          mkdir -p package/firmware/ipq-wifi/files
          cp /tmp/qca-wireless/board-ubnt_utr.qca4019 package/firmware/ipq-wifi/files/
          # Add Build/Prepare only in CI - not part of the PR
          sed -i 's/^define Build\/Compile/define Build\/Prepare\n\t$(call Build\/Prepare\/Default)\n\t$(CP) .\/files\/* $(PKG_BUILD_DIR)\/\nendef\n\ndefine Build\/Compile/' \
            package/firmware/ipq-wifi/Makefile

      - name: Configure for UTR
        run: |
          printf '%s\n' \
            'CONFIG_TARGET_ipq40xx=y' \
            'CONFIG_TARGET_ipq40xx_generic=y' \
            'CONFIG_TARGET_ipq40xx_generic_DEVICE_ubnt_utr=y' \
            'CONFIG_TARGET_MULTI_PROFILE=y' \
            'CONFIG_TARGET_PER_DEVICE_ROOTFS=y' \
            'CONFIG_TARGET_DEVICE_ipq40xx_generic_DEVICE_ubnt_utr=y' \
            'CONFIG_DISPLAY_SUPPORT=y' \
            'CONFIG_PACKAGE_kmod-bluetooth=m' \
            'CONFIG_PACKAGE_kmod-btmtk=m' \
            'CONFIG_PACKAGE_kmod-btusb=m' \
            'CONFIG_PACKAGE_kmod-crypto-aead=y' \
            'CONFIG_PACKAGE_kmod-crypto-ccm=y' \
            'CONFIG_PACKAGE_kmod-crypto-cmac=y' \
            'CONFIG_PACKAGE_kmod-crypto-crc32c=y' \
            'CONFIG_PACKAGE_kmod-crypto-ctr=y' \
            'CONFIG_PACKAGE_kmod-crypto-ecb=m' \
            'CONFIG_PACKAGE_kmod-crypto-ecdh=m' \
            'CONFIG_PACKAGE_kmod-crypto-gcm=y' \
            'CONFIG_PACKAGE_kmod-crypto-geniv=y' \
            'CONFIG_PACKAGE_kmod-crypto-gf128=y' \
            'CONFIG_PACKAGE_kmod-crypto-ghash=y' \
            'CONFIG_PACKAGE_kmod-crypto-hash=y' \
            'CONFIG_PACKAGE_kmod-crypto-hmac=y' \
            'CONFIG_PACKAGE_kmod-crypto-kpp=m' \
            'CONFIG_PACKAGE_kmod-crypto-lib-chacha20=m' \
            'CONFIG_PACKAGE_kmod-crypto-lib-chacha20poly1305=m' \
            'CONFIG_PACKAGE_kmod-crypto-lib-curve25519=m' \
            'CONFIG_PACKAGE_kmod-crypto-lib-poly1305=m' \
            'CONFIG_PACKAGE_kmod-crypto-manager=y' \
            'CONFIG_PACKAGE_kmod-crypto-null=y' \
            'CONFIG_PACKAGE_kmod-crypto-rng=y' \
            'CONFIG_PACKAGE_kmod-crypto-seqiv=y' \
            'CONFIG_PACKAGE_kmod-crypto-sha3=y' \
            'CONFIG_PACKAGE_kmod-crypto-sha512=y' \
            'CONFIG_PACKAGE_kmod-gpio-button-hotplug=y' \
            'CONFIG_PACKAGE_kmod-hwmon-core=y' \
            'CONFIG_PACKAGE_kmod-i2c-core=y' \
            'CONFIG_PACKAGE_kmod-hid=m' \
            'CONFIG_PACKAGE_kmod-input-core=m' \
            'CONFIG_PACKAGE_kmod-input-evdev=m' \
            'CONFIG_PACKAGE_kmod-leds-gpio=y' \
            'CONFIG_PACKAGE_kmod-lib-crc-ccitt=y' \
            'CONFIG_PACKAGE_kmod-lib-crc16=m' \
            'CONFIG_PACKAGE_kmod-lib-crc32c=y' \
            'CONFIG_PACKAGE_kmod-nls-base=y' \
            'CONFIG_PACKAGE_kmod-nf-conntrack=y' \
            'CONFIG_PACKAGE_kmod-nf-flow=y' \
            'CONFIG_PACKAGE_kmod-nf-log=y' \
            'CONFIG_PACKAGE_kmod-nf-log6=y' \
            'CONFIG_PACKAGE_kmod-nf-nat=y' \
            'CONFIG_PACKAGE_kmod-nf-reject=y' \
            'CONFIG_PACKAGE_kmod-nf-reject6=y' \
            'CONFIG_PACKAGE_kmod-nfnetlink=y' \
            'CONFIG_PACKAGE_kmod-nft-core=y' \
            'CONFIG_PACKAGE_kmod-nft-fib=y' \
            'CONFIG_PACKAGE_kmod-nft-nat=y' \
            'CONFIG_PACKAGE_kmod-nft-offload=y' \
            'CONFIG_PACKAGE_kmod-ppp=y' \
            'CONFIG_PACKAGE_kmod-pppoe=y' \
            'CONFIG_PACKAGE_kmod-pppox=y' \
            'CONFIG_PACKAGE_kmod-slhc=y' \
            'CONFIG_PACKAGE_kmod-tun=y' \
            'CONFIG_PACKAGE_kmod-udptunnel4=m' \
            'CONFIG_PACKAGE_kmod-udptunnel6=m' \
            'CONFIG_PACKAGE_kmod-wireguard=m' \
            'CONFIG_PACKAGE_kmod-dma-buf=y' \
            'CONFIG_PACKAGE_kmod-regmap-core=m' \
            'CONFIG_PACKAGE_kmod-usb-core=y' \
            'CONFIG_PACKAGE_kmod-usb-dwc3=y' \
            'CONFIG_PACKAGE_kmod-usb-dwc3-qcom=y' \
            'CONFIG_PACKAGE_kmod-usb-net=y' \
            'CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=m' \
            'CONFIG_PACKAGE_kmod-usb-net-cdc-eem=m' \
            'CONFIG_PACKAGE_kmod-usb-net-cdc-ether=m' \
            'CONFIG_PACKAGE_kmod-usb-net-cdc-subset=m' \
            'CONFIG_PACKAGE_kmod-usb-net-huawei-cdc-ncm=m' \
            'CONFIG_PACKAGE_kmod-usb-net-ipheth=m' \
            'CONFIG_PACKAGE_kmod-usb-net-rndis=m' \
            'CONFIG_PACKAGE_kmod-usb-roles=y' \
            'CONFIG_PACKAGE_kmod-usb-xhci-hcd=y' \
            'CONFIG_PACKAGE_kmod-usb3=y' \
            'CONFIG_PACKAGE_kmod-backlight=y' \
            'CONFIG_PACKAGE_kmod-backlight-gpio=y' \
            'CONFIG_PACKAGE_kmod-drm=y' \
            'CONFIG_PACKAGE_kmod-drm-dma-helper=y' \
            'CONFIG_PACKAGE_kmod-drm-kms-helper=y' \
            'CONFIG_PACKAGE_kmod-drm-mipi-dbi=y' \
            'CONFIG_PACKAGE_kmod-drm-panel-mipi-dbi=y' \
            'CONFIG_PACKAGE_kmod-fb=y' \
            'CONFIG_PACKAGE_kmod-fb-cfb-copyarea=y' \
            'CONFIG_PACKAGE_kmod-fb-cfb-fillrect=y' \
            'CONFIG_PACKAGE_kmod-fb-cfb-imgblt=y' \
            'CONFIG_PACKAGE_kmod-fb-sys-fops=y' \
            'CONFIG_PACKAGE_kmod-fb-sys-ram=y' \
            'CONFIG_PACKAGE_kmod-ath=y' \
            'CONFIG_PACKAGE_kmod-ath10k-ct=y' \
            'CONFIG_PACKAGE_kmod-cfg80211=y' \
            'CONFIG_PACKAGE_kmod-mac80211=y' \
            'CONFIG_PACKAGE_kmod-usb-common=y' \
            >> .config
          make defconfig

      - name: Build toolchain
        run: make toolchain/install -j$(nproc) V=s

      - name: Build target
        run: make -j$(nproc) V=s

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-2025.12-${{ github.run_number }}
          name: UTR Build 2025.12 ${{ github.run_number }}
          files: |
            bin/targets/ipq40xx/generic/*utr*
            bin/targets/ipq40xx/generic/packages/*

